<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Lançar Documentos</title>
<link rel="stylesheet" href="../style.css">
<style>
  .admin-container {
    max-width: 640px;
    margin: 48px auto 0;
    padding: 0 24px;
  }
  .admin-container h1 {
    font-size: 24px;
    color: #1565a3;
    margin-bottom: 8px;
  }
  .admin-container p.subtitulo {
    color: #666;
    margin-bottom: 32px;
  }
  .preview-imagem {
    margin-top: 12px;
    max-width: 100%;
    border: 1px solid #ccc;
    border-radius: 4px;
    display: none;
  }
  .lista-documentos {
    margin-top: 48px;
    border-top: 1px solid #ddd;
    padding-top: 24px;
  }
  .lista-documentos h2 {
    font-size: 18px;
    color: #333;
  }
  .item-documento {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .item-documento .info {
    color: #444;
  }
  .item-documento .excluir {
    color: #c62828;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
  }
  #loginBox {
    max-width: 400px;
    margin: 96px auto 0;
    padding: 0 24px;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Painel Administrativo</h1>
  </div>

  <!-- Tela de login -->
  <div id="loginBox">
    <div class="form-group">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" class="form-control" placeholder="Senha">
    </div>
    <button class="btn btn-primary" onclick="fazerLogin()">Entrar</button>
    <p id="loginErro" class="mensagem erro" style="display:none;"></p>
  </div>

  <!-- Painel (só aparece logado) -->
  <div class="admin-container" id="painel" style="display:none;">
    <h1>Lançar novo documento</h1>
    <p class="subtitulo">Preencha o código, a data e envie a imagem do documento físico.</p>

    <form id="formCadastro">
      <div class="form-group">
        <label for="codigo">Código de verificação <span class="required">*</span></label>
        <input type="text" id="codigo" class="form-control" placeholder="Ex: ABC123" required>
      </div>

      <div class="form-group">
        <label for="data">Data de assinatura ou geração <span class="required">*</span></label>
        <input type="date" id="data" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="arquivo">Imagem do documento <span class="required">*</span></label>
        <input type="file" id="arquivo" class="form-control" accept="image/*" required>
        <img id="preview" class="preview-imagem">
      </div>

      <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar documento</button>
    </form>

    <p id="mensagemCadastro" class="mensagem" style="display:none;"></p>

    <div class="lista-documentos">
      <h2>Documentos lançados recentemente</h2>
      <div id="listaDocumentos"></div>
    </div>

    <button class="btn btn-secondary" onclick="sair()" style="margin-top:32px;">Sair</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>

  <script>
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('painel').style.display = 'block';
        carregarDocumentos();
      } else {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('painel').style.display = 'none';
      }
    });

    function fazerLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value;
      const erroBox = document.getElementById('loginErro');
      erroBox.style.display = 'none';

      auth.signInWithEmailAndPassword(email, senha)
        .catch((erro) => {
          erroBox.textContent = 'E-mail ou senha inválidos.';
          erroBox.style.display = 'block';
        });
    }

    function sair() {
      auth.signOut();
    }

    const inputArquivo = document.getElementById('arquivo');
    const preview = document.getElementById('preview');
    inputArquivo.addEventListener('change', () => {
      const file = inputArquivo.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    function comprimirImagem(file, larguraMax = 1000, qualidade = 0.7) {
      return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const escala = Math.min(1, larguraMax / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * escala;
            canvas.height = img.height * escala;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', qualidade));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        leitor.onerror = reject;
        leitor.readAsDataURL(file);
      });
    }

    const formCadastro = document.getElementById('formCadastro');
    const btnSalvar = document.getElementById('btnSalvar');
    const mensagemCadastro = document.getElementById('mensagemCadastro');

    formCadastro.addEventListener('submit', async (event) => {
      event.preventDefault();

      const codigo = document.getElementById('codigo').value.trim();
      const data = document.getElementById('data').value;
      const file = inputArquivo.files[0];

      if (!codigo || !data || !file) return;

      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando...';
      mensagemCadastro.style.display = 'none';

      try {
        const docId = `${codigo}_${data}`;

        const imagemBase64 = await comprimirImagem(file);

        if (imagemBase64.length > 900000) {
          mensagemCadastro.textContent = 'A imagem ficou grande demais mesmo após compressão. Tente uma foto mais simples ou com menos resolução.';
          mensagemCadastro.className = 'mensagem erro';
          mensagemCadastro.style.display = 'block';
          btnSalvar.disabled = false;
          btnSalvar.textContent = 'Salvar documento';
          return;
        }

        await db.collection('documentos').doc(docId).set({
          codigo: codigo,
          data: data,
          imagemUrl: imagemBase64,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });

        mensagemCadastro.textContent = 'Documento salvo com sucesso!';
        mensagemCadastro.className = 'mensagem info';
        mensagemCadastro.style.display = 'block';

        formCadastro.reset();
        preview.style.display = 'none';
        carregarDocumentos();

      } catch (erro) {
        console.error(erro);
        mensagemCadastro.textContent = 'Erro ao salvar. Tente novamente.';
        mensagemCadastro.className = 'mensagem erro';
        mensagemCadastro.style.display = 'block';
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.textContent = 'Salvar documento';
      }
    });

    async function carregarDocumentos() {
      const lista = document.getElementById('listaDocumentos');
      lista.innerHTML = '<p style="color:#999;">Carregando...</p>';

      try {
        const snap = await db.collection('documentos')
          .orderBy('criadoEm', 'desc')
          .limit(20)
          .get();

        if (snap.empty) {
          lista.innerHTML = '<p style="color:#999;">Nenhum documento cadastrado ainda.</p>';
          return;
        }

        lista.innerHTML = '';
        snap.forEach((doc) => {
          const d = doc.data();
          const item = document.createElement('div');
          item.className = 'item-documento';
          item.innerHTML = `
            <span class="info">Código: <strong>${d.codigo}</strong> — Data: ${formatarData(d.data)}</span>
            <button class="excluir" onclick="excluirDocumento('${doc.id}')">Excluir</button>
          `;
          lista.appendChild(item);
        });
      } catch (erro) {
        console.error(erro);
        lista.innerHTML = '<p style="color:#c62828;">Erro ao carregar documentos.</p>';
      }
    }

    async function excluirDocumento(docId) {
      if (!confirm('Tem certeza que deseja excluir este documento?')) return;

      try {
        await db.collection('documentos').doc(docId).delete();
        carregarDocumentos();
      } catch (erro) {
        console.error(erro);
        alert('Erro ao excluir documento.');
      }
    }

    function formatarData(dataIso) {
      const [ano, mes, dia] = dataIso.split('-');
      return `${dia}/${mes}/${ano}`;
    }
  </script>

</body>
</html>
